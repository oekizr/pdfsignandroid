<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drive PDF Signer</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="toolbar">
    <span id="status">Memuat...</span>
    <div id="toolbar-actions">
      <select id="page-select" title="Tambahkan ke halaman"></select>
      <label class="btn" id="upload-label">
        + Upload Gambar
        <input type="file" id="image-input" accept="image/png,image/jpeg" hidden>
      </label>
      <button class="btn" id="draw-sign-btn">✍ Gambar Tanda Tangan</button>
      <button id="save-btn" disabled>Simpan ke Drive</button>
    </div>
  </div>
  <div id="viewer"></div>

  <div id="sign-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span>Gambar Tanda Tangan</span>
        <button id="sign-modal-close" class="icon-btn">×</button>
      </div>
      <canvas id="sign-pad" width="520" height="220"></canvas>
      <div class="modal-controls">
        <label>Warna
          <input type="color" id="sign-color" value="#1a1a2e">
        </label>
        <label>Ketebalan
          <input type="range" id="sign-thickness" min="1" max="12" value="3">
        </label>
        <button id="sign-clear-btn" class="btn-secondary">Hapus</button>
      </div>
      <div class="modal-footer">
        <button id="sign-cancel-btn" class="btn-secondary">Batal</button>
        <button id="sign-use-btn" class="btn">Gunakan</button>
      </div>
    </div>
  </div>

  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
